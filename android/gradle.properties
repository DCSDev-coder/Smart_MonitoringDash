org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Windows/Gradle/Kotlin incremental cache issues:
# The project was intermittently emitting "Storage ... is already registered" and
# "Could not close incremental caches" from Kotlin daemon during debug builds.
# Disable Kotlin incremental compilation + run compiler in-process to stabilize builds.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process
